name: Seite veröffentlichen

# Bei jedem Push auf den Hauptbranch wird die Seite gebaut und ausgeliefert.
# "workflow_dispatch" erlaubt zusätzlich einen Start von Hand über den
# Actions-Tab auf GitHub.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Rechte, die der Deploy braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deploys gleichzeitig. Laufende werden nicht abgebrochen,
# damit eine angefangene Veröffentlichung sauber zu Ende geht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
